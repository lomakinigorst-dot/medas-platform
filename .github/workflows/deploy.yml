name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t medas-frontend:latest \
            ./frontend

      - name: Save and compress image
        run: |
          docker save medas-frontend:latest | gzip > /tmp/medas-frontend.tar.gz
          echo "Image size: $(du -sh /tmp/medas-frontend.tar.gz | cut -f1)"

      - name: Upload frontend image to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          scp -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            /tmp/medas-frontend.tar.gz \
            root@${VPS_HOST}:/tmp/medas-frontend.tar.gz

      - name: Upload backend files to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            backend/app/core/config.py \
            backend/app/core/otp.py \
            root@${VPS_HOST}:/tmp/
          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            backend/app/api/v1/endpoints/auth.py \
            root@${VPS_HOST}:/tmp/auth_endpoint.py
          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            backend/app/schemas/auth.py \
            root@${VPS_HOST}:/tmp/auth_schema.py

      - name: Deploy on VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            root@${VPS_HOST} bash << 'REMOTE'
          set -e
          # Deploy backend files into running container
          BACKEND=medas-platform-backend-1
          docker cp /tmp/config.py         ${BACKEND}:/app/app/core/config.py
          docker cp /tmp/otp.py            ${BACKEND}:/app/app/core/otp.py
          docker cp /tmp/auth_endpoint.py  ${BACKEND}:/app/app/api/v1/endpoints/auth.py
          docker cp /tmp/auth_schema.py    ${BACKEND}:/app/app/schemas/auth.py
          docker restart ${BACKEND}
          rm -f /tmp/config.py /tmp/otp.py /tmp/auth_endpoint.py /tmp/auth_schema.py
          sleep 5
          echo "✅ Backend deployed"
          # Deploy frontend
          docker load < /tmp/medas-frontend.tar.gz
          rm -f /tmp/medas-frontend.tar.gz
          cd /app/medas-platform
          docker compose up -d --force-recreate frontend
          sleep 10
          CODE=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' https://saas.med-as.ru/)
          echo "HTTPS check: $CODE"
          [ "$CODE" = "200" ] && echo "✅ Frontend deploy OK" || (echo "❌ Failed: $CODE" && exit 1)
          REMOTE
